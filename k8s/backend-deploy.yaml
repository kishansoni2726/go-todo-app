apiVersion: apps/v1
kind: Deployment
metadata:
  creationTimestamp: null
  labels:
    app: todo-backend
  name: todo-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: todo-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: todo-backend
    spec:
      imagePullSecrets:
        - name: ecr-registry-secret
      containers:
      - image: todo:latest
        name: todo-backend
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
        resources: {}
status: {}